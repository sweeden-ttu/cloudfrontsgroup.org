<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t">
<title id="t">Book, magazine, tablet and phone showing published content formats</title>
<rect width="100%" height="100%" fill="#FCF8F3"/>
