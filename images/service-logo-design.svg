<path d="M16 58 H314" stroke="#B8C0CC" stroke-width="2"/>
<g transform="translate(62 72) scale(3.2)" fill="none" stroke="#0B1528" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<use href="#cl"/>
<path d="M8 44 L30 30 L30 44 M14 44 H60"/>
<use href="#an" x="14" y="44"/><use href="#an" x="50" y="44"/><use href="#an" x="52" y="28.3"/><use href="#an" x="31" y="22"/><use href="#an" x="14" y="30.5"/><use href="#an" x="60" y="44"/><use href="#an" x="8" y="44"/><use href="#an" x="30" y="30"/>
</g>
