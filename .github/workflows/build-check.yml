name: Build & HTML Verification Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow 2>/dev/null || true

      - name: Run Build Script
        run: |
          if [ -f "python3_build/build.py" ]; then
            python python3_build/build.py
          fi

      - name: Verify Git Diff Consistency
        run: |
          git diff --exit-code || (echo "Generated HTML differs from master. Run python3_build/build.py locally!" && exit 1)
