  <rect x="758" y="322" width="74" height="70" rx="8" fill="#FFE0C2"/>
  <rect x="758" y="408" width="74" height="12" rx="6" fill="#B8C0CC"/>
  <rect x="758" y="432" width="56" height="12" rx="6" fill="#B8C0CC"/>
  <rect x="758" y="456" width="66" height="12" rx="6" fill="#B8C0CC"/>
  <rect x="758" y="520" width="74" height="60" rx="8" fill="#CCEADD"/>
  <path d="M866 384 L916 403 V458 L866 439 Z" fill="#CCEADD" stroke="#0B1528" stroke-width="4" stroke-linejoin="round"/>
  <path d="M866 480 L916 499 M866 504 L902 518" stroke="#B8C0CC" stroke-width="9" stroke-linecap="round"/>

  <!-- phone with a simple ad layout -->
  <rect x="972" y="442" width="90" height="180" rx="18" fill="#0B1528" opacity="0.08"/>
  <rect x="960" y="430" width="90" height="182" rx="18" fill="#FFFFFF" stroke="#0B1528" stroke-width="7"/>
  <rect x="972" y="452" width="66" height="14" rx="6" fill="#0B1528"/>
  <rect x="972" y="474" width="66" height="54" rx="6" fill="#FFF0C7"/>
  <rect x="972" y="538" width="66" height="10" rx="5" fill="#B8C0CC"/>
  <rect x="972" y="556" width="46" height="10" rx="5" fill="#B8C0CC"/>
  <rect x="978" y="578" width="54" height="18" rx="9" fill="#0B1528"/>
