  <path d="M650 600 V330 L740 300 V610 Z" fill="#DEF2E8" stroke="#0B1528" stroke-width="7" stroke-linejoin="round"/>
  <path d="M850 300 L930 330 V600 L850 610 Z" fill="#DEF2E8" stroke="#0B1528" stroke-width="7" stroke-linejoin="round"/>
  <path d="M668 402 L722 384 V440 L668 458 Z" fill="#FFF0C7" stroke="#0B1528" stroke-width="4" stroke-linejoin="round"/>
  <path d="M668 480 L722 462 M668 504 L710 490" stroke="#B8C0CC" stroke-width="9" stroke-linecap="round"/>
