<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t">
<title id="t">Cloud storage connected to four devices showing the same folder</title>
<defs>
<path id="cloud" d="M-148 0 A62 62 0 0 1 -65 -92 A90 90 0 0 1 99 -56 A49 49 0 0 1 173 0 Z"/>
<g id="fd" stroke="#0B1528" stroke-width="5" stroke-linejoin="round">
<rect x="-40" y="-38" width="34" height="22" rx="6"/>
<rect x="-40" y="-26" width="80" height="60" rx="8"/>
</g>
</defs>
<rect width="100%" height="100%" fill="#FCF8F3"/>
<ellipse cx="700" cy="672" rx="560" ry="30" fill="#CCEADD" opacity="0.6"/>
<!-- connection lines -->
<g stroke="#0B1528" stroke-width="6" stroke-linecap="round" fill="none">
<path d="M690 420 L330 240"/>
<path d="M710 420 L1070 240"/>
<path d="M690 420 L330 545"/>
<path d="M710 420 L1070 545"/>
</g>
<g stroke="#0B1528" stroke-linecap="round" stroke-linejoin="round">
<!-- monitor, top left -->
<rect x="212" y="162" width="260" height="170" rx="16" fill="#0B1528" opacity="0.08" stroke="none"/>
<rect x="200" y="150" width="260" height="170" rx="16" fill="#FFFFFF" stroke-width="8"/>
<rect x="316" y="320" width="28" height="34" fill="#0B1528" stroke="none"/>
<rect x="270" y="352" width="120" height="14" rx="7" fill="#0B1528" stroke="none"/>
<use href="#fd" x="330" y="240" fill="#CCEADD"/>
<!-- tablet, top right -->
<rect x="962" y="162" width="240" height="170" rx="18" fill="#0B1528" opacity="0.08" stroke="none"/>
<rect x="950" y="150" width="240" height="170" rx="18" fill="#FFFFFF" stroke-width="8"/>
<circle cx="1070" cy="166" r="4" fill="#0B1528" stroke="none"/>
<use href="#fd" x="1070" y="242" fill="#CCEADD"/>
<!-- laptop, bottom left -->
<rect x="222" y="482" width="240" height="150" rx="14" fill="#0B1528" opacity="0.08" stroke="none"/>
<rect x="210" y="470" width="240" height="150" rx="14" fill="#FFFFFF" stroke-width="8"/>
<rect x="180" y="618" width="300" height="18" rx="9" fill="#0B1528" stroke="none"/>
<use href="#fd" x="330" y="548" fill="#CCEADD"/>
<!-- phone, bottom right -->
<rect x="1027" y="452" width="110" height="200" rx="20" fill="#0B1528" opacity="0.08" stroke="none"/>
<rect x="1015" y="440" width="110" height="200" rx="20" fill="#FFFFFF" stroke-width="8"/>
<use href="#fd" transform="translate(1070 545) scale(0.8)" fill="#CCEADD"/>
<!-- cloud -->
<use href="#cloud" transform="translate(712 492) scale(1.2)" fill="#0B1528" opacity="0.08" stroke="none"/>
<use href="#cloud" transform="translate(700 480) scale(1.2)" fill="#FFFFFF" stroke-width="8"/>
<!-- padlock: the single blue accent -->
<path d="M672 404 V382 A28 28 0 0 1 728 382 V404" fill="none" stroke-width="9"/>
<rect x="660" y="402" width="80" height="62" rx="12" fill="#2463EB" stroke-width="6"/>
<circle cx="700" cy="428" r="8" fill="#0B1528" stroke="none"/>
<path d="M700 434 V448" stroke-width="7"/>
</g>
</svg>
