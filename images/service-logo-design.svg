<rect id="tb" width="100" height="80" rx="6" fill="none" stroke="#B8C0CC" stroke-width="2"/>
<rect id="an" x="-1.6" y="-1.6" width="3.2" height="3.2" fill="#FFFFFF" stroke="#0B1528" stroke-width="0.8"/>
</defs>
<!-- desk mat -->
<rect x="230" y="150" width="940" height="492" rx="36" fill="#CCEADD" opacity="0.6"/>
