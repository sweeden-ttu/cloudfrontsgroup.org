<!-- coffee cup with mono mark on sleeve -->
<g transform="translate(1066 392)">
<path d="M10 52 L24 242 Q24 256 38 256 H122 Q136 256 136 242 L150 52 Z" fill="#0B1528" opacity="0.08"/>
<path d="M0 40 L14 230 Q14 244 28 244 H112 Q126 244 126 230 L140 40 Z" fill="#FFFFFF" stroke="#0B1528" stroke-width="6" stroke-linejoin="round"/>
<rect x="-10" y="14" width="160" height="30" rx="10" fill="#0B1528"/>
<rect x="22" y="0" width="96" height="18" rx="8" fill="#0B1528"/>
<path d="M6 110 L14 192 H126 L134 110 Z" fill="#FFE0C2" stroke="#0B1528" stroke-width="5" stroke-linejoin="round"/>
<use href="#mono" transform="translate(38 118)"/>
