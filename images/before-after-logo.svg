<g transform="rotate(-45)" stroke="#0B1528" stroke-width="4" opacity="0.75">
<rect x="-9" y="24" width="18" height="110" rx="9" fill="#0B1528" stroke="none"/>
<ellipse cx="0" cy="-42" rx="34" ry="66" fill="none"/>
<ellipse cx="0" cy="-42" rx="16" ry="66" fill="none"/>
</g>
<!-- crown -->
<path d="M-48 -92 L-54 -140 L-28 -112 L0 -152 L28 -112 L54 -140 L48 -92 Z" fill="#FFF0C7" stroke="#0B1528" stroke-width="4" stroke-linejoin="round" opacity="0.9"/>
<g fill="#0B1528" opacity="0.6"><circle cx="-54" cy="-142" r="5"/><circle cx="0" cy="-154" r="5"/><circle cx="54" cy="-142" r="5"/></g>
<!-- stars -->
<use href="#st" x="-80" y="-66"/><use href="#st" x="80" y="-66"/><use href="#st" x="-118" y="40"/><use href="#st" x="118" y="40"/><use href="#st" x="0" y="-196"/>
<!-- main ribbon -->
<path d="M-122 44 L-164 44 L-150 64 L-164 84 L-122 84 Z" fill="#0B1528" opacity="0.5"/>
<path d="M122 44 L164 44 L150 64 L164 84 L122 84 Z" fill="#0B1528" opacity="0.5"/>
<rect x="-128" y="40" width="256" height="48" rx="6" fill="#0B1528" opacity="0.78"/>
<g fill="#B8C0CC"><rect x="-96" y="59" width="56" height="10" rx="5"/><rect x="-30" y="59" width="70" height="10" rx="5"/><rect x="50" y="59" width="46" height="10" rx="5"/></g>
<!-- lower ribbon -->
<rect x="-92" y="102" width="184" height="30" rx="4" fill="#FFE0C2" stroke="#0B1528" stroke-width="3"/>
<g fill="#B8C0CC"><rect x="-70" y="112" width="60" height="10" rx="5"/><rect x="2" y="112" width="66" height="10" rx="5"/></g>
</g>
<!-- AFTER: wheat and sun -->
<g transform="translate(980 400)">
<circle cx="10" cy="-24" r="158" fill="#0B1528" opacity="0.08"/>
<circle cy="-36" r="158" fill="#FFF0C7"/>
<path d="M-150 148 H150" stroke="#0B1528" stroke-width="10" stroke-linecap="round"/>
<path d="M0 148 V-150" stroke="#0B1528" stroke-width="10" stroke-linecap="round"/>
<path d="M0 118 C-46 102 -74 66 -74 22 C-36 42 -10 76 0 118 Z" fill="#0B1528"/>
<use href="#gr" transform="translate(0 -176)"/>
<use href="#gr" transform="translate(-19 -140) rotate(-34)"/><use href="#gr" transform="translate(19 -140) rotate(34)"/>
<use href="#gr" transform="translate(-19 -102) rotate(-34)"/><use href="#gr" transform="translate(19 -102) rotate(34)"/>
<use href="#gr" transform="translate(-19 -64) rotate(-34)"/><use href="#gr" transform="translate(19 -64) rotate(34)"/>
<use href="#gr" transform="translate(-19 -26) rotate(-34)"/><use href="#gr" transform="translate(19 -26) rotate(34)"/>
<use href="#gr" transform="translate(-19 12) rotate(-34)"/><use href="#gr" transform="translate(19 12) rotate(34)"/>
</g>
<!-- arrow (the single blue accent) -->
<circle cx="700" cy="400" r="56" fill="#FCF8F3"/>
<path d="M664 400 H736 M712 376 L736 400 L712 424" stroke="#2463EB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
