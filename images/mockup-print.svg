<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t">
<title id="t">Business cards, brochure, letterhead and postcard laid out together</title>
<rect width="100%" height="100%" fill="#FCF8F3"/>
<defs>
<pattern id="p" width="36" height="36" patternUnits="userSpaceOnUse">
<rect width="36" height="36" fill="#FFE0C2"/>
<g fill="none" stroke="#0B1528" stroke-width="3.5">
<path d="M0 36 A18 18 0 0 1 36 36"/><path d="M-18 18 A18 18 0 0 1 18 18"/><path d="M18 18 A18 18 0 0 1 54 18"/>
</g>
</pattern>
<path id="cl" d="M14 44 H50 A8 8 0 0 0 52 28.3 A11 11 0 0 0 31 22 A9 9 0 0 0 14 30.5 A6.8 6.8 0 0 0 14 44 Z"/>
</defs>
<!-- tray / mat -->
<rect x="230" y="130" width="940" height="540" rx="40" fill="#CCEADD" opacity="0.6"/>
<!-- letterhead -->
<g transform="translate(170 150) rotate(-4)">
<rect x="10" y="12" width="300" height="400" rx="6" fill="#0B1528" opacity="0.08"/>
<rect width="300" height="400" rx="6" fill="#FFFFFF"/>
<rect x="24" y="24" width="252" height="54" rx="6" fill="url(#p)"/>
<circle cx="46" cy="118" r="14" fill="#0B1528"/>
<g fill="#B8C0CC"><rect x="24" y="156" width="200" height="10" rx="5"/><rect x="24" y="180" width="252" height="10" rx="5"/><rect x="24" y="204" width="180" height="10" rx="5"/><rect x="24" y="228" width="252" height="10" rx="5"/><rect x="24" y="252" width="230" height="10" rx="5"/><rect x="24" y="276" width="160" height="10" rx="5"/><rect x="24" y="300" width="252" height="10" rx="5"/><rect x="24" y="324" width="120" height="10" rx="5"/></g>
<rect x="24" y="360" width="252" height="16" rx="4" fill="url(#p)"/>
</g>
<!-- open brochure -->
<g transform="translate(540 160) rotate(2)">
<rect x="10" y="12" width="300" height="300" rx="6" fill="#0B1528" opacity="0.08"/>
<rect width="300" height="300" rx="6" fill="#FFFFFF"/>
<rect x="0" y="0" width="150" height="300" rx="6" fill="url(#p)"/>
<path d="M150 0 V300" stroke="#0B1528" stroke-width="3" opacity="0.2"/>
<circle cx="194" cy="52" r="16" fill="#0B1528"/>
<g fill="#B8C0CC"><rect x="172" y="96" width="104" height="10" rx="5"/><rect x="172" y="120" width="80" height="10" rx="5"/><rect x="172" y="144" width="96" height="10" rx="5"/><rect x="172" y="168" width="60" height="10" rx="5"/></g>
<rect x="172" y="200" width="104" height="70" rx="8" fill="#FFE0C2"/>
</g>
<!-- postcard -->
<g transform="translate(520 470) rotate(-3)">
<rect x="10" y="12" width="300" height="190" rx="6" fill="#0B1528" opacity="0.08"/>
<rect width="300" height="190" rx="6" fill="#FFFFFF"/>
<rect x="12" y="12" width="144" height="166" rx="6" fill="url(#p)"/>
<path d="M174 24 V166" stroke="#B8C0CC" stroke-width="2"/>
<rect x="250" y="20" width="30" height="36" rx="3" fill="none" stroke="#B8C0CC" stroke-width="2"/>
<g fill="#B8C0CC"><rect x="188" y="100" width="92" height="10" rx="5"/><rect x="188" y="124" width="70" height="10" rx="5"/><rect x="188" y="148" width="84" height="10" rx="5"/></g>
</g>
<!-- sticker sheet -->
<g transform="translate(930 150) rotate(3)">
<rect x="10" y="12" width="280" height="250" rx="10" fill="#0B1528" opacity="0.08"/>
<rect width="280" height="250" rx="10" fill="#FFFFFF"/>
<circle cx="56" cy="72" r="34" fill="#0B1528"/>
<use href="#cl" transform="translate(84 10) scale(1.7)" fill="#2463EB"/>
<rect x="194" y="42" width="60" height="60" rx="16" fill="#FFE0C2" stroke="#0B1528" stroke-width="4"/>
<circle cx="56" cy="176" r="34" fill="#FFE0C2" stroke="#0B1528" stroke-width="4"/>
<path d="M106 194 A34 34 0 0 1 174 194 Z" fill="#0B1528"/>
<rect x="190" y="162" width="66" height="30" rx="15" fill="#0B1528"/>
</g>
<!-- business cards fan -->
<g transform="translate(950 640)">
<g transform="rotate(-22)">
<rect x="8" y="-110" width="210" height="120" rx="10" fill="#0B1528" opacity="0.08"/>
<rect y="-120" width="210" height="120" rx="10" fill="url(#p)"/>
</g>
<g transform="rotate(-10)">
<rect x="8" y="-110" width="210" height="120" rx="10" fill="#0B1528" opacity="0.08"/>
<rect y="-120" width="210" height="120" rx="10" fill="#FFFFFF"/>
<path d="M10 -120 H58 V0 H10 A10 10 0 0 1 0 -10 V-110 A10 10 0 0 1 10 -120 Z" fill="url(#p)"/>
<circle cx="90" cy="-80" r="11" fill="#0B1528"/>
<g fill="#B8C0CC"><rect x="76" y="-52" width="92" height="9" rx="4.5"/><rect x="76" y="-34" width="64" height="9" rx="4.5"/></g>
</g>
<g transform="rotate(2)">
<rect x="8" y="-110" width="210" height="120" rx="10" fill="#0B1528" opacity="0.08"/>
<rect y="-120" width="210" height="120" rx="10" fill="#FFFFFF"/>
<path d="M10 -120 H58 V0 H10 A10 10 0 0 1 0 -10 V-110 A10 10 0 0 1 10 -120 Z" fill="url(#p)"/>
<circle cx="90" cy="-80" r="11" fill="#0B1528"/>
<g fill="#B8C0CC"><rect x="76" y="-52" width="92" height="9" rx="4.5"/><rect x="76" y="-34" width="64" height="9" rx="4.5"/></g>
</g>
</g>
</svg>
