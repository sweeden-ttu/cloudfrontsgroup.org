<g fill="#0B1528" opacity="0.5">
<circle cx="0" cy="-176" r="5"/><circle cx="88" cy="-152" r="5"/><circle cx="152" cy="-88" r="5"/><circle cx="176" cy="0" r="5"/>
<circle cx="152" cy="88" r="5"/><circle cx="-88" cy="-152" r="5"/><circle cx="-152" cy="-88" r="5"/><circle cx="-176" cy="0" r="5"/><circle cx="-152" cy="88" r="5"/>
</g>
<!-- sun behind -->
<g transform="translate(0 -28)" stroke="#0B1528" stroke-width="4" stroke-linecap="round" opacity="0.6">
