<g fill="none" stroke="#0B1528" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<g transform="translate(38 36) scale(1.1)"><path d="M8 44 H60 M14 44 A10 10 0 0 1 24 28 A14 14 0 0 1 48 24 A10 10 0 0 1 56 44"/></g>
<g transform="translate(144 36) scale(1.1)"><path d="M8 44 H60 M12 44 C10 30 22 24 30 30 C34 16 54 18 54 32 C62 34 62 44 56 44"/></g>
<g transform="translate(38 129) scale(1.1)"><path d="M8 44 H60 M20 44 A18 18 0 0 1 56 44 M6 44 L24 34"/><path d="M4 8 L64 58" opacity="0.5"/></g>
<g transform="translate(144 129) scale(1.1)"><path d="M10 44 H60 M16 44 C12 28 30 22 34 30 C40 16 58 22 56 44 M10 44 L30 32 L30 44"/></g>
<g transform="translate(38 222) scale(1.1)"><path d="M8 44 H60 M14 42 C14 26 30 20 36 28 C48 18 60 30 56 42 M30 42 V34"/></g>
<g transform="translate(144 222) scale(1.1)"><path d="M8 44 H60 M18 44 Q18 26 34 26 Q50 26 50 44 M50 44 L60 36"/></g>
