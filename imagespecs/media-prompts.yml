# Machine-readable copy of docs/media-prompts.md.
# Shipped as hand-authored SVGs (see svg-style-guide.md); og-default/blog-default are also rendered to PNG.
# Append `style_suffix` to every illustration prompt; pass `negative` where supported.
# Sizes are generation sizes (master PNG). Export WebP alongside at the same size.

style_suffix: >-
  Editorial flat-vector illustration with soft dimensional shading, clean geometric shapes and
  generous negative space. Palette: warm cream background #FCF8F3; deep navy #0B1528 for primary
  shapes and linework; brand blue #2463EB as the single strong accent; pastel fills only in mint
  #CCEADD, teal #DEF2E8, butter #FFF0C7 and peach #FFE0C2. Matte surfaces, no glow, no glass, no
  neon, no dark backgrounds. Absolutely no text, letters, numbers, logos or watermarks. Subtle
  Central Texas cues where natural: live oak, limestone, bluebonnets, hill-country horizon,
  small-town main street. Crisp edges, print-ready, centered composition with a calm 20% margin.

negative: >-
  text, words, letters, numbers, typography, watermark, signature, logo, glow, neon, glassmorphism,
  dark background, black background, gradient background, photorealistic faces, stock photo look,
  clutter, duplicate objects, extra fingers, blurry, low contrast, purple, pink

logo:
  - id: L1
    name: primary-mark
    size: [1024, 1024]
    file: images/logo/cloud-fronts-mark.svg
    prompt: >-
      Minimal logo mark for a technology company named for a weather front: a single rounded cloud
      silhouette whose flat base is a long horizon line extending right, with one clean diagonal
      wedge rising from the left edge of the horizon into the cloud to suggest a front moving in.
      Two-color flat vector, deep navy #0B1528 cloud and horizon, brand blue #2463EB wedge, on plain
      white. Geometric, balanced optical weight, no gradients, no shadows, no outline, no text.
      Centered in frame with 25% margin. Logo design, vector style, 1:1.
  - id: L2
    name: favicon
    size: [512, 512]
    file: favicon.svg
    prompt: >-
      Same mark as L1 simplified for a 16-pixel favicon: cloud and horizon merged into one solid
      navy #0B1528 shape, the blue #2463EB wedge kept as one bold stroke, no interior detail,
      strokes at least one tenth of the canvas width. Flat vector on white, 1:1, centered.
  - id: L3
    name: reversed-mark
    size: [1024, 1024]
    file: images/logo/cloud-fronts-mark-reversed.svg
    prompt: >-
      Same mark as L1 in reverse: cloud and horizon in warm cream #FCF8F3, wedge in mint #CCEADD,
      on a flat navy #0B1528 square with 20% margin. Flat vector, no glow, no gradient, 1:1.
  - id: L4
    name: monochrome-mark
    size: [1024, 1024]
    file: images/logo/cloud-fronts-mark-mono.svg
    prompt: >-
      Same mark as L1 in one color, solid navy #0B1528 on white, for print, embroidery and stamps.
      Flat vector, 1:1.
  - id: L5
    name: social-avatar
    size: [1024, 1024]
    file: images/logo/cloud-fronts-avatar.png
    prompt: >-
      The L1 mark centered on a flat brand-blue #2463EB circle that fills a square canvas, mark in
      cream #FCF8F3, 30% margin so it survives circular cropping on Facebook and X. Flat vector,
      1:1, 1024x1024.

slots:
  - id: H1
    page: index.html
    role: hero-background
    css: .hero-bg
    file: images/hero-banner.svg
    size: [3200, 1067]
    aspect: "3:1"
    alt: ""
    prompt: >-
      Ultra-wide panoramic illustration of the Texas Hill Country at golden hour: rolling limestone
      hills with live oaks in the foreground, a small town water tower and main street far right,
      and a long band of soft cumulus clouds rolling in from the left like a weather front, with
      faint data-line arcs connecting the clouds to the town. Keep the center third low-detail and
      medium-dark in tone so white headline text can sit over it. Horizontal composition, cinematic
      but flat-vector.
    dark_variant: >-
      Same scene with the sky in deep navy #0B1528 and dusk tones, clouds in slate and mint.
  - id: H2
    page: index.html
    role: og-default
    css: og:image fallback in _includes/head.html
    file: images/og-default.svg
    size: [1200, 630]
    aspect: "1.91:1"
    alt: ""
    prompt: >-
      Clean social-card illustration: an outline map of Texas in navy with Central Texas
