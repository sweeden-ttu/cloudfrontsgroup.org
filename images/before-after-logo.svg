<ellipse id="gr" rx="12" ry="27" fill="#0B1528"/>
</defs>
<!-- grounds -->
<ellipse cx="420" cy="652" rx="250" ry="32" fill="#CCEADD" opacity="0.6"/>
<ellipse cx="980" cy="652" rx="250" ry="32" fill="#DEF2E8" opacity="0.6"/>
<!-- divider -->
<path d="M700 170 V630" stroke="#0B1528" stroke-width="4" stroke-linecap="round" opacity="0.2"/>
<!-- BEFORE: overworked badge -->
<g transform="translate(420 400)">
<circle cx="12" cy="14" r="206" fill="#0B1528" opacity="0.08"/>
<use href="#sc" x="196" y="0"/><use href="#sc" x="181" y="75"/><use href="#sc" x="139" y="139"/><use href="#sc" x="75" y="181"/>
<use href="#sc" x="0" y="196"/><use href="#sc" x="-75" y="181"/><use href="#sc" x="-139" y="139"/><use href="#sc" x="-181" y="75"/>
<use href="#sc" x="-196" y="0"/><use href="#sc" x="-181" y="-75"/><use href="#sc" x="-139" y="-139"/><use href="#sc" x="-75" y="-181"/>
<use href="#sc" x="0" y="-196"/><use href="#sc" x="75" y="-181"/><use href="#sc" x="139" y="-139"/><use href="#sc" x="181" y="-75"/>
<circle r="196" fill="#B8C0CC"/>
<circle r="184" fill="#0B1528" opacity="0.55"/>
<circle r="168" fill="#FFE0C2"/>
<circle r="160" fill="none" stroke="#0B1528" stroke-width="4" stroke-dasharray="6 10" opacity="0.6"/>
<circle r="148" fill="#FFF0C7"/>
<circle r="140" fill="none" stroke="#0B1528" stroke-width="3" opacity="0.5"/>
