<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t">
<title id="t">A cluttered logo on the left redesigned into a simple geometric mark on the right</title>
<rect width="100%" height="100%" fill="#FCF8F3"/>
<defs>
<circle id="sc" r="26" fill="#B8C0CC"/>
<ellipse id="lf" rx="9" ry="21" fill="#0B1528" opacity="0.5"/>
