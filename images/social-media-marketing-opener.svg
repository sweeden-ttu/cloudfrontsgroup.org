      <circle cx="938" cy="26" r="12" fill="#0B1528"/>
      <rect x="960" y="20" width="90" height="12" rx="6" fill="#B8C0CC"/>
      <rect x="926" y="48" width="188" height="78" rx="8" fill="#FFE0C2"/>
      <path d="M0 -6 C-3 -15 -18 -15 -18 -3 C-18 8 -6 15 0 21 C6 15 18 8 18 -3 C18 -15 3 -15 0 -6 Z" fill="#FFE0C2" stroke="#0B1528" stroke-width="4" transform="translate(944 147) scale(0.7)"/>
      <rect x="972" y="136" width="30" height="22" rx="8" fill="#DEF2E8" stroke="#0B1528" stroke-width="4"/>
      <rect x="1020" y="142" width="80" height="10" rx="5" fill="#B8C0CC"/>
    </g>
    <g transform="translate(0 350)">
      <rect x="912" y="0" width="216" height="168" rx="14" fill="#FFFFFF" stroke="#0B1528" stroke-width="5"/>
      <circle cx="938" cy="26" r="12" fill="#0B1528"/>
      <rect x="960" y="20" width="90" height="12" rx="6" fill="#B8C0CC"/>
      <rect x="926" y="48" width="188" height="78" rx="8" fill="#CCEADD"/>
      <path d="M0 -6 C-3 -15 -18 -15 -18 -3 C-18 8 -6 15 0 21 C6 15 18 8 18 -3 C18 -15 3 -15 0 -6 Z" fill="#FFE0C2" stroke="#0B1528" stroke-width="4" transform="translate(944 147) scale(0.7)"/>
      <rect x="972" y="136" width="30" height="22" rx="8" fill="#DEF2E8" stroke="#0B1528" stroke-width="4"/>
      <rect x="1020" y="142" width="80" height="10" rx="5" fill="#B8C0CC"/>
    </g>
    <g transform="translate(0 530)">
      <rect x="912" y="0" width="216" height="168" rx="14" fill="#FFFFFF" stroke="#0B1528" stroke-width="5"/>
      <circle cx="938" cy="26" r="12" fill="#0B1528"/>
      <rect x="960" y="20" width="90" height="12" rx="6" fill="#B8C0CC"/>
      <rect x="926" y="48" width="188" height="78" rx="8" fill="#FFF0C7"/>
      <path d="M0 -6 C-3 -15 -18 -15 -18 -3 C-18 8 -6 15 0 21 C6 15 18 8 18 -3 C18 -15 3 -15 0 -6 Z" fill="#FFE0C2" stroke="#0B1528" stroke-width="4" transform="translate(944 147) scale(0.7)"/>
      <rect x="972" y="136" width="30" height="22" rx="8" fill="#DEF2E8" stroke="#0B1528" stroke-width="4"/>
      <rect x="1020" y="142" width="80" height="10" rx="5" fill="#B8C0CC"/>
    </g>
  </g>
  <rect x="990" y="138" width="60" height="8" rx="4" fill="#0B1528"/>

  <!-- reactions floating up and out of the phone -->
  <use href="#heart" fill="#FFE0C2" stroke="#0B1528" stroke-width="4" transform="translate(1176 226) scale(1.25)"/>
  <use href="#bubble" transform="translate(1220 160) scale(0.9)"/>
  <use href="#heart" fill="#FFE0C2" stroke="#0B1528" stroke-width="4" transform="translate(1232 300) scale(1.0)"/>
  <use href="#bubble" transform="translate(1190 378) scale(0.7)"/>
  <use href="#heart" fill="#FFE0C2" stroke="#0B1528" stroke-width="4" transform="translate(1226 440) scale(0.75)"/>

  <!-- the one blue accent: link from a calendar square to the top post -->
  <path d="M657 479 C 790 479 800 244 980 244" fill="none" stroke="#2463EB" stroke-width="7" stroke-linecap="round"/>
  <circle cx="657" cy="479" r="12" fill="#2463EB"/>
  <circle cx="980" cy="244" r="12" fill="#2463EB"/>
</svg>
