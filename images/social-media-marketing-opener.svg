<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t">
  <title id="t">Content calendar beside a phone showing social posts with reactions</title>
  <rect width="100%" height="100%" fill="#FCF8F3"/>
  <defs>
    <rect id="cell" width="62" height="62" rx="10" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="4"/>
    <g id="pic">
      <rect width="62" height="62" rx="10" fill="#FFF0C7" stroke="#0B1528" stroke-width="5"/>
      <circle cx="44" cy="20" r="8" fill="#FFE0C2"/>
      <path d="M8 52 L24 30 L36 44 L46 36 L56 52 Z" fill="#0B1528"/>
    </g>
    <clipPath id="scr"><rect x="896" y="128" width="248" height="538" rx="24"/></clipPath>
    <path id="heart" d="M0 -6 C-3 -15 -18 -15 -18 -3 C-18 8 -6 15 0 21 C6 15 18 8 18 -3 C18 -15 3 -15 0 -6 Z"/>
    <g id="bubble">
      <path d="M-22 -16 H22 A10 10 0 0 1 32 -6 V8 A10 10 0 0 1 22 18 H-4 L-16 30 V18 H-22 A10 10 0 0 1 -32 8 V-6 A10 10 0 0 1 -22 -16 Z" fill="#DEF2E8" stroke="#0B1528" stroke-width="5" stroke-linejoin="round"/>
    </g>
  </defs>

  <ellipse cx="700" cy="700" rx="540" ry="16" fill="#CCEADD" opacity="0.6"/>

  <!-- monthly content calendar -->
  <rect x="192" y="162" width="540" height="450" rx="22" fill="#0B1528" opacity="0.08"/>
  <rect x="180" y="150" width="540" height="450" rx="22" fill="#FFFFFF" stroke="#0B1528" stroke-width="8"/>
  <path d="M180 206 H720" stroke="#0B1528" stroke-width="7"/>
  <path d="M180 172 A22 22 0 0 1 202 150 H698 A22 22 0 0 1 720 172 V206 H180 Z" fill="#0B1528"/>
  <rect x="206" y="172" width="120" height="12" rx="6" fill="#FCF8F3" opacity="0.7"/>
  <g fill="#FCF8F3" opacity="0.7"><circle cx="668" cy="178" r="6"/><circle cx="694" cy="178" r="6"/></g>
  <use href="#cell" x="206" y="232"/><use href="#cell" x="276" y="232"/><rect x="346" y="232" width="62" height="62" rx="10" fill="#CCEADD" stroke="#0B1528" stroke-width="5"/><use href="#cell" x="416" y="232"/><use href="#cell" x="486" y="232"/><rect x="556" y="232" width="62" height="62" rx="10" fill="#DEF2E8" stroke="#0B1528" stroke-width="5"/><use href="#cell" x="626" y="232"/><rect x="206" y="304" width="62" height="62" rx="10" fill="#FFE0C2" stroke="#0B1528" stroke-width="5"/><use href="#cell" x="276" y="304"/><use href="#cell" x="346" y="304"/><use href="#cell" x="416" y="304"/><use href="#cell" x="486" y="304"/><use href="#cell" x="556" y="304"/><rect x="626" y="304" width="62" height="62" rx="10" fill="#FFF0C7" stroke="#0B1528" stroke-width="5"/><use href="#cell" x="206" y="376"/><use href="#cell" x="276" y="376"/><use href="#cell" x="416" y="376"/><rect x="486" y="376" width="62" height="62" rx="10" fill="#CCEADD" stroke="#0B1528" stroke-width="5"/><use href="#cell" x="556" y="376"/><use href="#cell" x="626" y="376"/><rect x="206" y="448" width="62" height="62" rx="10" fill="#DEF2E8" stroke="#0B1528" stroke-width="5"/><use href="#cell" x="276" y="448"/><use href="#cell" x="346" y="448"/><rect x="416" y="448" width="62" height="62" rx="10" fill="#FFF0C7" stroke="#0B1528" stroke-width="5"/><use href="#cell" x="486" y="448"/><use href="#cell" x="556" y="448"/><use href="#cell" x="206" y="520"/><use href="#cell" x="276" y="520"/><rect x="346" y="520" width="62" height="62" rx="10" fill="#CCEADD" stroke="#0B1528" stroke-width="5"/><use href="#cell" x="416" y="520"/><use href="#cell" x="486" y="520"/><use href="#cell" x="556" y="520"/><use href="#cell" x="626" y="520"/>
  <use href="#pic" x="346" y="376"/><use href="#pic" x="626" y="448"/>

  <!-- phone with a feed of three posts -->
  <rect x="892" y="124" width="280" height="570" rx="36" fill="#0B1528" opacity="0.08"/>
  <rect x="880" y="112" width="280" height="570" rx="36" fill="#FFFFFF" stroke="#0B1528" stroke-width="8"/>
  <rect x="896" y="128" width="248" height="538" rx="24" fill="#FCF8F3"/>
  <g clip-path="url(#scr)">
