<!-- 2. refined pencil drawing with construction circles -->
<g transform="translate(450 170) rotate(3)">
<rect x="10" y="12" width="280" height="330" rx="8" fill="#0B1528" opacity="0.08"/>
<rect width="280" height="330" rx="8" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="2"/>
<g transform="translate(30 90) scale(3.4)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g stroke="#B8C0CC" stroke-width="0.6"><circle cx="50.5" cy="36.2" r="8"/><circle cx="41.5" cy="26" r="11"/><circle cx="22.5" cy="26.3" r="9.5"/><circle cx="14" cy="37.3" r="6.8"/><path d="M0 44 H66 M31 10 V58 M8 44 L30 30 L30 44"/></g>
<use href="#cl" stroke="#0B1528" stroke-width="1.3"/>
<path d="M8 44 L30 30 L30 44 M14 44 H60" stroke="#0B1528" stroke-width="1.3"/>
</g>
<g fill="#B8C0CC"><rect x="30" y="280" width="90" height="8" rx="4"/><rect x="130" y="280" width="60" height="8" rx="4"/></g>
