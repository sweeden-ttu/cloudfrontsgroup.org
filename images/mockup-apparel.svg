<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t">
<title id="t">T-shirt, cap, tote bag, mug, bottle and pen with matching branding</title>
<rect width="100%" height="100%" fill="#FCF8F3"/>
<defs>
<g id="m"><path d="M14 44 H50 A8 8 0 0 0 52 28.3 A11 11 0 0 0 31 22 A9 9 0 0 0 14 30.5 A6.8 6.8 0 0 0 14 44 Z"/><path d="M14 44 H60" stroke-width="3" stroke-linecap="round" fill="none"/></g>
<path id="sh" d="M-120 -80 L-60 -112 Q-30 -86 0 -86 Q30 -86 60 -112 L120 -80 L150 -22 L105 0 L105 170 Q105 185 90 185 H-90 Q-105 185 -105 170 L-105 0 L-150 -22 Z"/>
<path id="cp" d="M-90 30 A90 95 0 0 1 90 30 Z"/>
<path id="br" d="M-96 30 Q-80 54 -30 54 L134 54 Q156 54 150 36 Q134 30 90 30 Z"/>
<rect id="tt" x="-95" y="-60" width="190" height="210" rx="14"/>
<rect id="mg" x="-50" y="-70" width="100" height="140" rx="14"/>
<rect id="bt" x="-40" y="-120" width="80" height="230" rx="24"/>
</defs>
<!-- ground -->
<ellipse cx="700" cy="668" rx="540" ry="40" fill="#CCEADD" opacity="0.6"/>
<!-- mug -->
<g transform="translate(215 560)">
<use href="#mg" x="10" y="12" fill="#0B1528" opacity="0.08"/>
<path d="M60 -25 Q110 -25 110 15 Q110 55 60 55" fill="none" stroke="#0B1528" stroke-width="12" stroke-linecap="round"/>
<use href="#mg" fill="#FFFFFF" stroke="#0B1528" stroke-width="6"/>
<use href="#m" transform="translate(-34 -36)" fill="#2463EB" stroke="#2463EB"/>
</g>
<!-- cap -->
<g transform="translate(400 380)">
<use href="#cp" x="10" y="12" fill="#0B1528" opacity="0.08"/>
<use href="#br" x="10" y="12" fill="#0B1528" opacity="0.08"/>
<use href="#cp" fill="#0B1528"/>
<use href="#br" fill="#0B1528"/>
<path d="M-90 30 Q-50 40 0 40 Q50 40 90 30" fill="none" stroke="#FCF8F3" stroke-width="3" opacity="0.5"/>
<path d="M0 -64 V26" stroke="#FCF8F3" stroke-width="3" opacity="0.35"/>
<circle cy="-64" r="7" fill="#FCF8F3"/>
<use href="#m" transform="translate(6 -46)" fill="#2463EB" stroke="#2463EB"/>
</g>
<!-- t-shirt -->
<g transform="translate(700 350)">
<use href="#sh" x="12" y="14" fill="#0B1528" opacity="0.08"/>
<use href="#sh" fill="#0B1528"/>
<path d="M-60 -112 Q-30 -86 0 -86 Q30 -86 60 -112" fill="none" stroke="#FCF8F3" stroke-width="3" opacity="0.5"/>
<path d="M-105 0 L-150 -22 M105 0 L150 -22" stroke="#FCF8F3" stroke-width="3" opacity="0.35"/>
<use href="#m" transform="translate(-51 -40) scale(1.5)" fill="#2463EB" stroke="#2463EB"/>
</g>
<!-- tote -->
<g transform="translate(1000 400)">
<use href="#tt" x="10" y="12" fill="#0B1528" opacity="0.08"/>
<path d="M-58 -60 C-58 -150 58 -150 58 -60" fill="none" stroke="#0B1528" stroke-width="9" stroke-linecap="round"/>
<use href="#tt" fill="#FFE0C2" stroke="#0B1528" stroke-width="6"/>
<use href="#m" transform="translate(-51 -9) scale(1.5)" fill="#2463EB" stroke="#2463EB"/>
</g>
<!-- bottle -->
<g transform="translate(1150 540)">
<use href="#bt" x="10" y="12" fill="#0B1528" opacity="0.08"/>
<rect x="-24" y="-152" width="48" height="44" rx="10" fill="#0B1528"/>
<use href="#bt" fill="#FFFFFF" stroke="#0B1528" stroke-width="6"/>
<use href="#m" transform="translate(-34 -56)" fill="#2463EB" stroke="#2463EB"/>
</g>
<!-- pen -->
<g transform="translate(700 626)">
<rect x="-140" y="3" width="300" height="18" rx="9" fill="#0B1528" opacity="0.08"/>
<rect x="-150" y="-9" width="300" height="18" rx="9" fill="#0B1528"/>
<path d="M150 -9 L180 0 L150 9 Z" fill="#0B1528"/>
<rect x="-140" y="-15" width="64" height="7" rx="3.5" fill="#0B1528"/>
<rect x="-70" y="-9" width="5" height="18" fill="#FCF8F3" opacity="0.5"/>
<use href="#m" transform="translate(-20 -16) scale(0.45)" fill="#2463EB" stroke="#2463EB"/>
</g>
</svg>
