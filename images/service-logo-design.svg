<rect x="0" y="-7" width="210" height="14" rx="7" fill="#0B1528"/>
<path d="M210 -7 L232 0 L210 7 Z" fill="#B8C0CC"/>
</g>
<!-- 4. business card with the finished mark -->
<g transform="translate(1000 222) rotate(-6)">
<rect x="10" y="12" width="220" height="130" rx="10" fill="#0B1528" opacity="0.08"/>
<rect width="220" height="130" rx="10" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="2"/>
<use href="#color" transform="translate(16 30) scale(1.25)"/>
<g fill="#B8C0CC"><rect x="118" y="52" width="76" height="10" rx="5"/><rect x="118" y="70" width="56" height="10" rx="5"/><rect x="118" y="88" width="66" height="10" rx="5"/></g>
