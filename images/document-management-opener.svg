<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t">
<title id="t">Paper files passing through a scanner and becoming digital folders</title>
<defs>
<path id="cloud" d="M-148 0 A62 62 0 0 1 -65 -92 A90 90 0 0 1 99 -56 A49 49 0 0 1 173 0 Z"/>
<g id="sheet" stroke="#0B1528" stroke-linejoin="round">
<rect x="0" y="0" width="100" height="130" rx="8" fill="#FFFFFF" stroke-width="6"/>
<g fill="#B8C0CC" stroke="none">
<rect x="18" y="22" width="64" height="9" rx="4"/>
<rect x="18" y="42" width="48" height="9" rx="4"/>
<rect x="18" y="62" width="64" height="9" rx="4"/>
<rect x="18" y="82" width="38" height="9" rx="4"/>
</g>
</g>
<g id="folder" stroke="#0B1528" stroke-width="6" stroke-linejoin="round">
<rect x="0" y="-22" width="66" height="34" rx="8"/>
<rect x="0" y="0" width="170" height="110" rx="14"/>
</g>
</defs>
<rect width="100%" height="100%" fill="#FCF8F3"/>
<ellipse cx="700" cy="668" rx="560" ry="34" fill="#DEF2E8" opacity="0.6"/>
<g stroke="#0B1528" stroke-linecap="round" stroke-linejoin="round">
<!-- filing cabinet -->
<rect x="202" y="262" width="230" height="400" rx="18" fill="#0B1528" opacity="0.08" stroke="none"/>
<rect x="190" y="250" width="230" height="400" rx="18" fill="#FFE0C2" stroke-width="8"/>
<rect x="214" y="276" width="182" height="104" rx="10" fill="#FFFFFF" stroke-width="6"/>
<!-- papers spilling from the open top drawer -->
<use href="#sheet" transform="translate(236 214) rotate(-12)"/>
<use href="#sheet" transform="translate(298 196)"/>
<use href="#sheet" transform="translate(352 212) rotate(14)"/>
<rect x="214" y="326" width="182" height="54" rx="10" fill="#FFF0C7" stroke-width="6"/>
<rect x="283" y="347" width="44" height="12" rx="6" fill="#0B1528" stroke="none"/>
<rect x="214" y="398" width="182" height="104" rx="10" fill="#FFF0C7" stroke-width="6"/>
<rect x="283" y="444" width="44" height="12" rx="6" fill="#0B1528" stroke="none"/>
<rect x="214" y="520" width="182" height="104" rx="10" fill="#FFF0C7" stroke-width="6"/>
<rect x="283" y="566" width="44" height="12" rx="6" fill="#0B1528" stroke="none"/>
<!-- a loose sheet on the floor -->
<use href="#sheet" transform="translate(452 584) rotate(10) scale(0.8)"/>
<!-- scanner with a sheet feeding in -->
<rect x="542" y="482" width="340" height="80" rx="20" fill="#0B1528" opacity="0.08" stroke="none"/>
<use href="#sheet" transform="translate(650 318)"/>
<rect x="556" y="426" width="288" height="54" rx="14" fill="#CCEADD" stroke-width="6"/>
<rect x="530" y="470" width="340" height="80" rx="20" fill="#FFFFFF" stroke-width="8"/>
<circle cx="836" cy="532" r="9" fill="#CCEADD" stroke-width="5"/>
<!-- brand-blue arrow passing through the scanner: the single blue accent -->
<path d="M470 510 H936 M902 476 L938 510 L902 544" fill="none" stroke="#2463EB" stroke-width="12"/>
<!-- cloud with folder stack -->
<use href="#cloud" transform="translate(1102 612) scale(0.9)" fill="#0B1528" opacity="0.08" stroke="none"/>
<use href="#cloud" transform="translate(1090 600) scale(0.9)" fill="#FFFFFF" stroke-width="8"/>
<use href="#folder" x="1005" y="278" fill="#FFF0C7"/>
<use href="#folder" x="1005" y="334" fill="#DEF2E8"/>
<use href="#folder" x="1005" y="390" fill="#CCEADD"/>
</g>
</svg>
