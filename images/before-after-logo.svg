</g>
<!-- laurel -->
<g>
<use href="#lf" transform="rotate(-100) translate(0 -118) rotate(-35)"/><use href="#lf" transform="rotate(-120) translate(0 -118) rotate(-35)"/>
<use href="#lf" transform="rotate(-140) translate(0 -118) rotate(-35)"/><use href="#lf" transform="rotate(-160) translate(0 -118) rotate(-35)"/>
<use href="#lf" transform="rotate(100) translate(0 -118) rotate(35)"/><use href="#lf" transform="rotate(120) translate(0 -118) rotate(35)"/>
<use href="#lf" transform="rotate(140) translate(0 -118) rotate(35)"/><use href="#lf" transform="rotate(160) translate(0 -118) rotate(35)"/>
</g>
<!-- wheat sprigs -->
<g fill="none" stroke="#0B1528" stroke-width="4" stroke-linecap="round" opacity="0.6">
<path d="M-70 80 C-110 40 -120 -20 -96 -70"/>
<path d="M70 80 C110 40 120 -20 96 -70"/>
<path d="M-96 -70 L-112 -84 M-96 -70 L-78 -82 M-104 -48 L-120 -60 M-104 -48 L-86 -60 M-108 -24 L-124 -34 M-108 -24 L-90 -36"/>
<path d="M96 -70 L112 -84 M96 -70 L78 -82 M104 -48 L120 -60 M104 -48 L86 -60 M108 -24 L124 -34 M108 -24 L90 -36"/>
</g>
